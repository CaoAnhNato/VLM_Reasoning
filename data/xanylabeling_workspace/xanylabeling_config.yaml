language: en_US
theme: dark
font_family: null
model_hub: github
device: null
auto_save: true
display_label_popup: true
store_data: false
keep_prev: false
keep_prev_scale: false
keep_prev_brightness: false
keep_prev_contrast: false
auto_use_last_label: false
auto_use_last_gid: false
auto_highlight_shape: true
auto_switch_to_edit_mode: true
exif_scan_enabled: false
show_groups: true
show_masks: true
show_texts: true
show_labels: true
show_scores: false
show_degrees: false
show_shapes: true
show_linking: true
show_attributes: true
logger_level: info
qt_image_allocation_limit: 0
system_clipboard: false
switch_to_checked: false
file_list_checkbox_editable: true

flags: null
label_flags: null
labels:
  - Q1_gt
  - Q2_gt
  - Q3_gt
  - Q4_gt
  - Q5_gt
  - Q6_gt
  - Q7_gt
  - Q8_gt
  - Q9_gt
  - Q10_gt
  - aux_text
file_search: null
sort_labels: false
validate_label: null

default_shape_color: [0, 230, 90]
shape_color: manual
shift_auto_shape_color: 0
label_colors:
  Q1_gt: [0, 230, 90]
  Q2_gt: [0, 190, 255]
  Q3_gt: [255, 180, 0]
  Q4_gt: [255, 75, 145]
  Q5_gt: [165, 105, 255]
  Q6_gt: [255, 110, 50]
  Q7_gt: [50, 225, 200]
  Q8_gt: [220, 235, 50]
  Q9_gt: [255, 90, 90]
  Q10_gt: [140, 200, 255]
  aux_text: [160, 160, 160]

shape:
  line_color: [0, 255, 0, 200]
  fill_color: [220, 220, 220, 70]
  vertex_fill_color: [0, 255, 0, 255]
  select_line_color: [255, 255, 255, 255]
  select_fill_color: [0, 255, 0, 120]
  hvertex_fill_color: [255, 255, 255, 255]
  point_size: 10
  line_width: 3

flag_dock:
  show: false
  closable: true
  movable: true
  floatable: true
label_dock:
  show: true
  closable: true
  movable: true
  floatable: true
shape_dock:
  show: true
  closable: true
  movable: true
  floatable: true
description_dock:
  show: true
  closable: true
  movable: true
  floatable: true
file_dock:
  show: true
  closable: true
  movable: true
  floatable: true

canvas:
  label_font_size: 10
  epsilon: 10.0
  double_click: close
  double_click_edit_label: true
  num_backups: 20
  wheel_rectangle_editing:
    enable: true
    adjust_step: 2.0
    scale_step: 0.05
  crosshair:
    show: true
    width: 1.5
    color: "#00FF00"
    opacity: 0.5
